name = "Stylus"
grammar = "stylus"
path_suffixes = ["styl"]
line_comments = ["// "]
block_comment = ["/* ", " */"]
tab_size = 2
autoclose_before = ";:.,=}])>"
brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = true },
    { start = "(", end = ")", close = true, newline = true },
    { start = "\"", end = "\"", close = true, newline = false, not_in = [
        "string",
        "comment",
    ] },
    { start = "'", end = "'", close = true, newline = false, not_in = [
        "string",
        "comment",
    ] },
]
word_characters = ["-", "$"]
